name: Validate species model pipeline

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow==11.3.0 numpy==2.2.6
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q distill tests
      - name: Validate Scrypted configs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('config.json').read_text())
          assert config['model'] == 'resnet'
          assert config['input_shape'] == [1, 3, 480, 480]
          assert len(config['labels']) == 2498
          assert {Path(path).parts[1] for path in config['files']} == {
              'coreml', 'ncnn', 'onnx', 'openvino'
          }
          assert not list(Path('models').glob('*/config.json'))
          PY
